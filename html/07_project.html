<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castillo de Molina | Hernández Sánchez Studio</title>
    <meta name="description" content="529_CDM, proyecto audiovisual para Castillo de Molina con postproducción de Hernández Sánchez Studio.">
    <link rel="icon" type="image/png" href="/img/HS-StudioLogo_v01-blackOnWhite.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div data-site-header></div>

  <section class="hero-video-section">
    <div class="video-container">
      <video class="hero-video" autoplay loop muted playsinline preload="metadata" poster="../img/529_CDM_cdm-01.webp">
        <source src="../img/529_CDM_banner_webOptimized.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <div class="project-section">
    <h1 class="projectPage-project-subTitle">Castillo de Molina</h1>
    <div class="projectPage-project-description">
      <p>
        Una pieza para Castillo de Molina que celebra los encuentros, las conversaciones y esos momentos que se disfrutan alrededor de una copa de vino.
      </p>
      <p class="projectPage-project-credits">
        Producción: Hombre Lobo Films.<br>
        Dirección: Vicente Subercaseux.<br>
        Dirección de Fotografía: Miguel Bunster.<br>
        Post producción: HS Studio.
      </p>
    </div>
  </div>

  <div class="embedded-video-section">
    <div class="project-page-video-container">
      <div class="video-wrapper">
        <iframe src="https://player.vimeo.com/video/1222556899?title=0&amp;byline=0&amp;portrait=0" title="Castillo de Molina" width="100%" height="100%" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <div class="gallery-section">
    <div class="container">
      <div class="gallery-grid">
        <div class="gallery-item">
          <img src="../img/529_CDM_cdm-01.webp" alt="Amigos compartiendo una cena en el proyecto Castillo de Molina" width="1600" height="900" loading="lazy">
        </div>
        <div class="gallery-item">
          <img src="../img/529_CDM_cdm-02.webp" alt="Mujer durante una celebración de Castillo de Molina" width="1600" height="900" loading="lazy">
        </div>
        <div class="gallery-item">
          <img src="../img/529_CDM_cdm-03.webp" alt="Brindis nocturno en el proyecto Castillo de Molina" width="1600" height="900" loading="lazy">
        </div>
        <div class="gallery-item">
          <img src="../img/529_CDM_cdm-04.webp" alt="Botella de Castillo de Molina Gran Reserva" width="1600" height="900" loading="lazy">
        </div>
        <div class="gallery-item">
          <img src="../img/529_CDM_cdm-05.webp" alt="Grupo reunido alrededor de una mesa al aire libre" width="1600" height="900" loading="lazy">
        </div>
        <div class="gallery-item">
          <img src="../img/529_CDM_cdm-06.webp" alt="Amigos conversando y disfrutando una copa de vino" width="1600" height="900" loading="lazy">
        </div>
      </div>
    </div>
  </div>

  <div data-site-footer></div>

  <script src="/javascript/layout.js"></script>
  <script src="/javascript/home.js"></script>
</body>
</html>
